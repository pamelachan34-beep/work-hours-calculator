<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上下班工時計算機</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#111827;color:#f9fafb;max-width:560px;margin:auto;padding:24px}label{display:block;margin:18px 0}input,select{font-size:20px;width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #64748b;background:#1f2937;color:white}.card{background:#1f2937;padding:18px;border-radius:14px;margin:12px 0}.big{font-size:28px;font-weight:700;margin:8px 0}.muted{color:#cbd5e1}#status{font-weight:bold}</style><h1>上下班工時計算機</h1><label>刷進時間<input id="start" type="time" value="13:00"></label><label>休息分鐘<input id="rest" type="number" value="60" min="0" max="840"></label><div class="card"><div class="muted">一般 12 小時實際工時｜最晚刷退</div><div class="big" id="normal"></div></div><div class="card"><div class="muted">刷卡間隔 14 小時｜絕對上限</div><div class="big" id="limit"></div></div><div class="card"><h2>檢查預計刷退</h2><label>日期<select id="day"><option value="0">當天</option><option value="1" selected>隔天</option></select></label><label>刷退時間<input id="end" type="time" value="00:30"></label><p id="hours"></p><p id="status"></p></div><p class="muted">依你提供的規則：一般實際工時最多 12 小時；例外可超過 12 小時，但刷進到刷退不得超過 14 小時。</p><script>const $=x=>document.getElementById(x);function min(s){let a=s.split(':').map(Number);return a[0]*60+a[1]}function fmt(n){return (n>=1440?'隔天 ':'當天 ')+String(Math.floor(n%1440/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function dur(n){return Math.floor(n/60)+' 小時 '+n%60+' 分'}function calc(){let s=min($('start').value),r=Number($('rest').value),e=min($('end').value)+1440*Number($('day').value);if(!Number.isFinite(r)||r<0||r>840){$('status').textContent='請輸入 0～840 分鐘的休息時間';return}$('normal').textContent=fmt(s+720+r);$('limit').textContent=fmt(s+840);let t=e-s;if(t<0){$('hours').textContent='';$('status').textContent='刷退早於刷進，請選擇隔天';return}$('hours').textContent='刷卡間隔：'+dur(t)+'｜實際工時：'+dur(Math.max(0,t-r));$('status').textContent=t>840?'❌ 超過刷卡 14 小時上限':t-r>720?'⚠️ 超過一般 12 小時，須使用例外額度':'✅ 未超過一般 12 小時'}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',calc));calc();</script></html>
