<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>工時計算機</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}main{max-width:460px;margin:auto;padding:30px 20px}h1{font-size:28px;margin:0 0 8px}.sub{font-size:13px;color:#aebbd0;margin:0 0 32px}label{display:block;font-size:15px;color:#d7e0ef;margin-bottom:10px}input{display:block;width:175px;max-width:100%;background:#222f42;color:white;border:1px solid #52627a;border-radius:12px;padding:12px;font-size:19px;min-height:52px;color-scheme:dark}input:focus{outline:2px solid #81a7e6}.panel{background:#202c3e;border-radius:16px;padding:20px;margin:14px 0}.caption{font-size:14px;color:#b7c7da}.value{font-size:32px;font-weight:750;margin-top:10px}footer{font-size:12px;color:#94a5bd;line-height:1.7;margin-top:26px}
</style></head><body><main><h1>工時計算機</h1><p class="sub">休息固定 60 分鐘 · 實際工時最多 14 小時</p><label for="start">刷進時間</label><input id="start" type="time" value="13:00"><section class="panel"><div class="caption">一般上限｜實際工時 12 小時</div><div class="value" id="normal">隔天 02:00</div></section><section class="panel"><div class="caption">絕對上限｜實際工時 14 小時</div><div class="value" id="limit">隔天 04:00</div></section><footer>依照你提供的規則：固定扣除 1 小時休息；一般實際工時上限 12 小時，例外可超過 12 小時，但扣除休息後的實際工時不得超過 14 小時（刷卡間隔最多 15 小時）。</footer></main><script>
(function(){const start=document.getElementById('start'),normal=document.getElementById('normal'),limit=document.getElementById('limit');function fmt(n){const v=n%1440;return(n>=1440?'隔天 ':'當天 ')+String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}function update(){const m=/^(\d{2}):(\d{2})$/.exec(start.value);if(!m){normal.textContent='請選擇時間';limit.textContent='—';return}const h=Number(m[1]),min=Number(m[2]);if(h>23||min>59){normal.textContent='請選擇有效時間';limit.textContent='—';return}const t=h*60+min;normal.textContent=fmt(t+780);limit.textContent=fmt(t+900)}start.addEventListener('input',update);start.addEventListener('change',update);update()})();
</script></body></html>
